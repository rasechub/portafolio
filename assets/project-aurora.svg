<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgAurora)"/>
  <!-- Store layout -->
  <rect x="60" y="45" width="480" height="270" rx="12" fill="#1e1b4b" stroke="#6d28d9" stroke-width="2"/>
  <circle cx="85" cy="65" r="5" fill="#ef4444"/>
  <circle cx="105" cy="65" r="5" fill="#f59e0b"/>
  <circle cx="125" cy="65" r="5" fill="#10b981"/>
  <text x="300" y="70" fill="#c084fc" font-family="sans-serif" font-size="13" text-anchor="middle">Aurora Modern Storefront</text>
  <!-- Products cards -->
  <rect x="90" y="100" width="115" height="135" rx="8" fill="#312e81"/>
  <rect x="100" y="110" width="95" height="70" rx="6" fill="#4338ca"/>
  <rect x="105" y="190" width="70" height="8" rx="4" fill="#a5b4fc"/>
  <rect x="105" y="205" width="45" height="10" rx="5" fill="#ec4899"/>

  <rect x="240" y="100" width="115" height="135" rx="8" fill="#312e81"/>
  <rect x="250" y="110" width="95" height="70" rx="6" fill="#4338ca"/>
  <rect x="255" y="190" width="70" height="8" rx="4" fill="#a5b4fc"/>
  <rect x="255" y="205" width="45" height="10" rx="5" fill="#ec4899"/>

  <rect x="390" y="100" width="115" height="135" rx="8" fill="#312e81"/>
  <rect x="400" y="110" width="95" height="70" rx="6" fill="#4338ca"/>
  <rect x="405" y="190" width="70" height="8" rx="4" fill="#a5b4fc"/>
  <rect x="405" y="205" width="45" height="10" rx="5" fill="#ec4899"/>

  <!-- Checkout bar -->
  <rect x="90" y="255" width="415" height="35" rx="8" fill="url(#purplePink)"/>
  <text x="297" y="277" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Stripe One-Click Checkout Demo</text>
</svg>
