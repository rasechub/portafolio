<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09201a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgFit)"/>
  <!-- Phone Frame -->
  <rect x="220" y="30" width="160" height="300" rx="24" fill="#022c22" stroke="#10b981" stroke-width="3"/>
  <rect x="260" y="42" width="80" height="12" rx="6" fill="#047857"/>
  <!-- Heart Rate Wave -->
  <circle cx="300" cy="120" r="35" fill="none" stroke="#34d399" stroke-width="4" stroke-dasharray="160" opacity="0.8"/>
  <text x="300" y="125" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">142 BPM</text>
  <path d="M 240 190 L 265 190 L 275 165 L 285 210 L 295 180 L 305 195 L 315 190 L 360 190" fill="none" stroke="#10b981" stroke-width="3"/>
  <!-- Progress Bars -->
  <rect x="245" y="230" width="110" height="12" rx="6" fill="#064e3b"/>
  <rect x="245" y="230" width="85" height="12" rx="6" fill="url(#neonGreen)"/>
  <rect x="245" y="255" width="110" height="12" rx="6" fill="#064e3b"/>
  <rect x="245" y="255" width="60" height="12" rx="6" fill="#38bdf8"/>
  <text x="300" y="305" fill="#a7f3d0" font-family="sans-serif" font-size="12" text-anchor="middle">FitPulse Mobile</text>
</svg>
